name: Deploy Backend (Azure Functions)

# MANUAL deploy only (workflow_dispatch). The automatic deploy on push to main was
# deliberately removed for the .NET 8 -> .NET 10 migration: the Azure runtime stack
# (az functionapp runtime config set --runtime-version 10.0) and the code package must be
# switched together. See docs/net10-upgrade-runbook.md before running this workflow.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages
        run: dotnet restore backend/OCPittem.Functions/OCPittem.Functions.csproj --configfile backend/OCPittem.Functions/nuget.config

      - name: Restore test project
        run: dotnet restore backend/OCPittem.Functions.Tests/OCPittem.Functions.Tests.csproj --configfile backend/OCPittem.Functions/nuget.config

      - name: Build
        run: dotnet build backend/OCPittem.Functions.Tests/OCPittem.Functions.Tests.csproj -c Release --no-restore

      - name: Test (gate before deploy)
        run: dotnet test backend/OCPittem.Functions.Tests/OCPittem.Functions.Tests.csproj -c Release --no-build

      - name: Azure Login
        uses: Azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Show tool versions
        run: |
          dotnet --version
          func --version

      - name: Deploy to Flex Consumption
        run: |
          cd backend/OCPittem.Functions
          func azure functionapp publish func-ocpittem-2026 --dotnet-isolated
